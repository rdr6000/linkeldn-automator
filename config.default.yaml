# Default Application Configuration Template for LinkedIn Automation System
mcp_url: http://localhost:8001/mcp
headless: true
playwright_storage: data/cookies.json
database_url: sqlite:///./data/history.db
mode: approval
ai_provider: gemini
gemini_model: gemini-2.5-flash
openai_model: gpt-4o-mini
recency: past-week
keywords:
  - AI automation
  - Software Engineering
generate_custom_connection_notes: true
send_custom_connection_notes: true
comment_style: Specific, insightful, highly relevant to post details, peer-to-peer conversational, 1-3 sentences
connection_note_style: Warm, specific, referencing target headline or domain focus, under 180 characters
custom_instructions: NO generic AI slop ('Great post!', 'Thanks for sharing!', 'Spot on!', 'In today's fast-paced world'). Quote or reference specific facts/ideas from the post. Sound like an authentic human peer having a real conversation.
user_persona: ''
enabled_actions:
  - comment
  - connect
  - follow
feed:
  enabled: true
  sort_by: recent
  max_feed_comments: 5
  max_feed_likes: 5
search:
  max_posts_per_keyword: 3
  max_people_per_keyword: 3
  sort_by: relevance
  content_type: all
  network_degree: 2nd
  title_filter: ''
  location_filter: ''
daily_limits:
  max_feed_posts: 50
  comments: 10
  connections: 10
